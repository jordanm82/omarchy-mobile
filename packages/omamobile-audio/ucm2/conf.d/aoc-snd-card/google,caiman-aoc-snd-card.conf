# SPDX-License-Identifier: MIT
# Pixel 9 Pro (caiman, zumapro): the AoC sound card (card driver name
# "aoc-snd-card", card name "google,caiman-aoc-snd-card"; alsa-ucm-conf tries
# conf.d/<driver>/<long name>.conf before conf.d/<driver>/<driver>.conf, so
# this file wins over cheetah's aoc-snd-card.conf). Speakers through the two
# CS35L41s on TDM 0, built-in microphones 0, 1 and 2 through the AoC.
Syntax 6

SectionUseCase."HiFi" {
	File "/Google/caiman/HiFi.conf"
	Comment "Speaker and microphones"
}
