# SPDX-License-Identifier: MIT
# HiFi verb for the AoC sound card on caiman (Pixel 9 Pro, zumapro), after the
# stock audio HAL's configuration (vendor/etc/mixer_paths.xml and
# audio_platform_configuration.xml):
#
#   Speaker  deep-buffer playback, AoC entry point 6 ("EP6 playback"), routed to
#            TDM 0, where the two CS35L41 amplifiers play slot 0 (top, left)
#            and slot 1 (bottom, right);
#   Mic      recording, AoC entry point 1 ("EP1 capture"), from the built-in
#            microphones (AoC mic IDs 0, 1, 2).
#
# Never touch the amplifier controls here: PCM source, DSP protection firmware,
# factory calibration, and stage ceilings belong to omamobile-speaker-protection.

SectionVerb {
	EnableSequence [
		cset "name='TDM_0_RX Chan' Four"
		cset "name='TDM_0_RX Format' S32_LE"
		cset "name='TDM_0_RX Sample Rate' SR_48K"
		cset "name='TDM_0_TX Chan' Four"
		cset "name='TDM_0_TX Format' S32_LE"
		cset "name='TDM_0_TX Sample Rate' SR_48K"

		# deep-buffer playback: EP6 to TDM 0
		cset "name='TDM_0_RX Mixer EP6' 1"

		# built-in microphones: caiman stock handset-mic/audio-record list 0,1,2,-1
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,1,2,-1"
		cset "name='MIC DC Blocker' 1"
		cset "name='MIC Record Soft Gain (dB)' 22"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 1"
	]

	DisableSequence [
		cset "name='TDM_0_RX Mixer EP6' 0"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},${find-device:type=pcm,stream=playback,field=id,regex='^EP6 playback'}"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},${find-device:type=pcm,stream=capture,field=id,regex='^EP1 capture'}"
		CaptureChannels 2
		CaptureRate 48000
	}
}
