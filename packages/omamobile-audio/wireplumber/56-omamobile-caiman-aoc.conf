# SPDX-License-Identifier: MIT
# The AoC sound card on caiman (Pixel 9 Pro), card name
# "google,caiman-aoc-snd-card". No mmap, stock deep-buffer periods, software
# volume only (hardware amplifier controls belong to omamobile-speaker-protection).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*", api.alsa.card.name = "google,caiman-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Audio"
        device.form-factor = "internal"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*", api.alsa.card.name = "google,caiman-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Speaker"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.*", api.alsa.card.name = "google,caiman-aoc-snd-card" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Audio Microphone"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
]
