# The four cameras of caiman, named for camera apps:
#   /base/soc/usi@108c00c0/i2c@108c0000/camera@3d  Samsung S5KGNK  main (wide)
#   /base/soc/usi@108900c0/i2c@10890000/camera@1a  Sony IMX858     ultrawide
#   /base/soc/usi@108800c0/i2c@10880000/camera@33  Sony IMX858     telephoto
#   /base/soc/usi@108a00c0/i2c@108a0000/camera@1a  Sony IMX858     front
# The main camera gets the highest priority, so apps open it first.
monitor.libcamera.rules = [
  {
    matches = [ { api.libcamera.path = "/base/soc/usi@108c00c0/i2c@108c0000/camera@3d" } ]
    actions = { update-props = { node.description = "Main camera", node.nick = "Main camera", priority.session = 1000 } }
  }
  {
    matches = [ { api.libcamera.path = "/base/soc/usi@108900c0/i2c@10890000/camera@1a" } ]
    actions = { update-props = { node.description = "Ultrawide camera", node.nick = "Ultrawide camera", priority.session = 900 } }
  }
  {
    matches = [ { api.libcamera.path = "/base/soc/usi@108800c0/i2c@10880000/camera@33" } ]
    actions = { update-props = { node.description = "Telephoto camera", node.nick = "Telephoto camera", priority.session = 850 } }
  }
  {
    matches = [ { api.libcamera.path = "/base/soc/usi@108a00c0/i2c@108a0000/camera@1a" } ]
    actions = { update-props = { node.description = "Front camera", node.nick = "Front camera", priority.session = 950 } }
  }
]

# The CSIS write DMA video nodes carry raw Bayer frames that only libcamera
# can use, and an app opening one would hold the camera: keep them out of PipeWire.
monitor.v4l2.rules = [
  {
    matches = [ { device.name = "~v4l2_device.platform-1c0.0000.csis" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
