# SPDX-License-Identifier: MIT
# Device descriptor: Google Pixel 9 Pro (caiman), Tensor G4 (zumapro).
# Each value's provenance is recorded in NOTES.md. No shell: data only.
CODENAME=caiman
NAME="Pixel 9 Pro"
SOC=zumapro
COMPATIBLE="google,zumapro-caiman"
PACKAGE=omamobile-device-caiman
DTB=exynos/google/zumapro-caiman.dtb
DTB_OVERLAYS="aoc-sound modem-cpif"
SOC_COMPATIBLE="a0-foplp:0x9875:0:0:0 a1-foplp:0x9875:0:1:0"
AVB_FOOTERS="boot:0x4000000 init_boot:0x800000"
AVB_ROLLBACK_INDEX=1791158400
AVB_SECURITY_PATCH=2026-10-05
DTBO_SOURCE=caiman-m1-overlay.dts
DTBO_BOARD_ID=0x60906
DTBO_BOARD_REV=0x10000
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on bootconfig"
VENDOR_PAGESIZE=0x800
OS_VERSION=17.0.0
OS_PATCH_LEVEL=2026-10
BOOT_IMAGES="boot init_boot vendor_boot vendor_kernel_boot dtbo"
UFS_RW="boot_b init_boot_b vendor_boot_b vendor_kernel_boot_b dtbo_b userdata"
NV_PARTS="efs efs_backup modem_userdata persist modem_a modem_b"
NV_BACKUP_EXTRA="devinfo metadata trusty_persist trusty_userdata"
INITRAMFS_INIT=/initramfs/init
# DECON0 TRIG_CON (0x19470030) reads 0x3070 at handover (M1.3); 0x3061 unmasks software trigger.
SIMPLEFB_TRIG_CON="0x19470030 0x3061"
PANEL_SIZE=1280x2856
SAFE_INSET_X=34
SAFE_INSET_BOTTOM=18
