# SPDX-License-Identifier: MIT
# AoC: only omamobile-caiman-aoc-start loads these in order. Explicit modprobe
# still works.
blacklist trusty_core
blacklist trusty_log
blacklist trusty_ipc
blacklist trusty_virtio
blacklist gsa
blacklist gs201_aoc_sysmmu
blacklist mailbox_wc
blacklist aoc_core
blacklist aoc_channel_dev
blacklist aoc_char_dev
# The sound card's driver would load at boot and pull aoc_core, gsa and Trusty
# in ahead of the order above; the start script loads it with the others.
blacklist aoc_alsa_dev
blacklist aoc_alsa_dev_util
# The CS35L41 speaker amplifiers stay guarded until speaker protection is ready.
blacklist snd_soc_cs35l41_spi
