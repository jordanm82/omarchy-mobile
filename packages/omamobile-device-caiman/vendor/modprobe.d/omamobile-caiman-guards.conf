# Loaded only by omamobile-caiman-graphics-start in order after a synced
# marker is written; blacklisting stops udev from autoloading ahead of the
# guard while explicit "modprobe ..." still succeeds. No "install X /bin/false"
# lines: those break the guard's own modprobe.
blacklist panthor
blacklist gs_decon
blacklist cs40l26_vibra
blacklist leds_lm3644
blacklist max77779_battery
blacklist hci_uart
blacklist nxp_nci_i2c
