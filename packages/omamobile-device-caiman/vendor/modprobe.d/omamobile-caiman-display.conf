# Allow 120 Hz once gs-dsim-cmd carries the panel link timers (falls back to
# 60 Hz otherwise), and put the CM4 panel to sleep on DPMS off
# (omamobile-caiman-graphics-start enables gs_dsim_cmd.allow_tx for
# google-cm4 before loading gs_decon).
options gs_decon max_refresh=120 screen_off=2
